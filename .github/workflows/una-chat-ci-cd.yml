name: Desplegar chat en Render

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # 1. Pruebas automáticas (package.json)
      - name: Ejecutar pruebas
        run: npm test

      # 2. Despliegue en Render (solo se ejecuta si las pruebas pasan)
      - name: Solicitar despliegue
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Do not send ref=$GITHUB_SHA. Render answers 404 when that
          # commit is not in the service's linked repository, and a
          # pinned ref also disables automatic deploys.
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
